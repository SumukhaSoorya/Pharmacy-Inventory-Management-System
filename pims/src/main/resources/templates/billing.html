<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PIMS Billing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef3f9;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #0f172a;
            color: white;
            padding: 15px 25px;
        }

        .medicine-card {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
        }

        .medicine-card:hover {
            transform: scale(1.03);
        }

        .medicine-card img {
            height: 90px;
            object-fit: contain;
        }

        .cart-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            position: sticky;
            top: 20px;
        }

        .search-box {
            border-radius: 12px;
            height: 50px;
        }

        .bill-btn {
            height: 50px;
            font-size: 18px;
            border-radius: 12px;
        }

        .total-box {
            background: #0f172a;
            color: white;
            border-radius: 12px;
            padding: 15px;
        }
    </style>
</head>

<body>

<div class="topbar d-flex justify-content-between align-items-center">
    <h3>💊 PIMS Billing System</h3>

    <div>
        <a href="/dashboard" class="btn btn-light">Dashboard</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</div>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- LEFT SIDE -->
        <div class="col-md-8">

            <div class="card shadow-sm p-3 mb-4 border-0">
                <input type="text"
                       id="searchBox"
                       class="form-control form-control-lg search-box"
                       placeholder="🔍 Search medicine or scan barcode"
                       autofocus>
            </div>

            <div class="row" id="medicineContainer">

                <div class="col-md-3 mb-4"
                     th:each="m : ${medicines}">

                    <div class="card medicine-card shadow-sm p-3 text-center">

                        <img th:src="${m.imageUrl != null && m.imageUrl != '' ? m.imageUrl : 'https://cdn-icons-png.flaticon.com/512/4320/4320337.png'}">

                        <h6 class="mt-3" th:text="${m.name}"></h6>

                        <p class="text-muted" th:text="${m.category}"></p>

                        <button class="btn btn-primary w-100"
                                th:attr="onclick=|addToCart(${m.id}, '${m.name}', 100)|">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>
        </div>

        <!-- RIGHT CART -->
        <div class="col-md-4">
            <div class="cart-box shadow">

                <h4>🛒 Cart</h4>
                <hr>

                <input type="text"
                       id="customerName"
                       class="form-control mb-3"
                       placeholder="Customer Name">

                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Medicine</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                    </thead>

                    <tbody id="cartBody"></tbody>
                </table>

                <input type="number"
                       id="discount"
                       class="form-control mb-3"
                       placeholder="Discount"
                       value="0">

                <div class="total-box mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <span>₹<span id="subtotal">0</span></span>
                    </div>

                    <div class="d-flex justify-content-between">
                        <span>GST 12%</span>
                        <span>₹<span id="gst">0</span></span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">
                        <strong>Grand Total</strong>
                        <strong>₹<span id="grandTotal">0</span></strong>
                    </div>
                </div>

                <select id="paymentMode" class="form-control mb-3">
                    <option>Cash</option>
                    <option>Card</option>
                    <option>UPI</option>
                </select>

                <button onclick="generateBill()"
                        class="btn btn-success w-100 bill-btn">
                    Generate Bill & Download PDF
                </button>

            </div>
        </div>

    </div>
</div>

<script>
    let cart = [];

    document.getElementById("searchBox")
        .addEventListener("keyup", function () {

            let value = this.value.toLowerCase();
            let cards = document.querySelectorAll(".medicine-card");

            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                card.parentElement.style.display =
                    text.includes(value) ? "block" : "none";
            });
        });

    function addToCart(id, name, price) {

        let existing = cart.find(i => i.medicineId === id);

        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({
                medicineId: id,
                medicineName: name,
                quantity: 1,
                unitPrice: price
            });
        }

        renderCart();
    }

    function renderCart() {

        let body = document.getElementById("cartBody");
        body.innerHTML = "";

        let subtotal = 0;
        let gst = 0;

        cart.forEach(item => {

            let itemSubtotal = item.unitPrice * item.quantity;
            let itemGst = itemSubtotal * 0.12;
            let itemTotal = itemSubtotal + itemGst;

            subtotal += itemSubtotal;
            gst += itemGst;

            body.innerHTML += `
                <tr>
                    <td>${item.medicineName}</td>
                    <td>${item.quantity}</td>
                    <td>₹${itemTotal.toFixed(2)}</td>
                </tr>
            `;
        });

        let discount =
            Number(document.getElementById("discount").value || 0);

        document.getElementById("subtotal").innerText =
            subtotal.toFixed(2);

        document.getElementById("gst").innerText =
            gst.toFixed(2);

        document.getElementById("grandTotal").innerText =
            (subtotal + gst - discount).toFixed(2);
    }

    document.getElementById("discount")
        .addEventListener("input", renderCart);

    function generateBill() {

        if (cart.length === 0) {
            alert("Please add medicines to cart");
            return;
        }

        let request = {
            customerName:
                document.getElementById("customerName").value || "Walk-in Customer",

            paymentMode:
                document.getElementById("paymentMode").value,

            discount:
                Number(document.getElementById("discount").value || 0),

            items: cart
        };

        fetch("/billing/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(request)
        })
        .then(response => response.text())
        .then(id => {
            alert("Bill generated successfully!");
            window.location.href = "/billing/pdf/" + id;
        })
        .catch(error => {
            console.error(error);
            alert("Error generating bill");
        });
    }
</script>

</body>
</html>
