<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Billing POS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }

        .pos-card {
            border: none;
            border-radius: 20px;
        }

        .medicine-card {
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
            background: white;
        }

        .medicine-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
        }

        .bill-box {
            background: #f8fafc;
            border-radius: 18px;
            padding: 18px;
        }

        .print-bill {
            border: 1px dashed #94a3b8;
            border-radius: 16px;
            padding: 18px;
            background: #ffffff;
        }

        .success-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container-fluid mt-4 px-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>🧾 Billing / POS</h2>
            <p class="text-muted">Generate customer bill for shopkeeper reference</p>
        </div>

        <a href="/dashboard" class="btn btn-dark">Dashboard</a>
    </div>

    <div class="row g-4">

        <!-- LEFT SIDE -->
        <div class="col-md-7">

            <div class="card pos-card shadow p-4 mb-4">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Customer Name</label>
                        <input id="customerName"
                               class="form-control"
                               placeholder="Walk-in Customer">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Payment Mode</label>
                        <select id="paymentMode" class="form-control">
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                            <option value="UPI">UPI</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Discount ₹</label>
                        <input id="discount"
                               type="number"
                               value="0"
                               min="0"
                               class="form-control">
                    </div>
                </div>

                <input type="text"
                       id="search"
                       class="form-control"
                       placeholder="Search medicine by name...">

            </div>

            <div class="row" id="medicineList">

                <div class="col-md-4 mb-3 medicine-wrapper"
                     th:each="m : ${medicines}">

                    <div class="card medicine-card p-3 h-100">

                        <h6 class="medicine-name" th:text="${m.name}">Medicine</h6>

                        <p class="text-muted mb-2"
                           th:text="${m.category != null ? m.category : 'General'}">
                            Category
                        </p>

                        <button type="button"
                                class="btn btn-primary btn-sm"
                                th:attr="data-name=${m.name}"
                                onclick="addToCart(this.getAttribute('data-name'), 10)">
                            Add ₹10
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE CART -->
        <div class="col-md-5">

            <div class="card pos-card shadow p-4">

                <h4>🛒 Cart</h4>

                <table class="table align-middle mt-3">
                    <thead class="table-dark">
                    <tr>
                        <th>Medicine</th>
                        <th style="width:90px;">Qty</th>
                        <th>Price</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody id="cartBody">
                    <tr>
                        <td colspan="5" class="text-center text-muted">
                            No items added.
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="bill-box mt-3">
                    <p>Subtotal: ₹<span id="subtotal">0.00</span></p>
                    <p>GST 12%: ₹<span id="gst">0.00</span></p>
                    <p>Discount: ₹<span id="discountShow">0.00</span></p>
                    <h4>Total: ₹<span id="grandTotal">0.00</span></h4>
                </div>

                <button type="button"
                        onclick="generateBill()"
                        class="btn btn-success w-100 mt-3">
                    Generate Bill
                </button>

                <div id="billResult"
                     class="alert alert-success mt-3 d-none">
                </div>

            </div>

        </div>

    </div>

</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        if (!name || name.trim() === "") {
            alert("Invalid medicine name");
            return;
        }

        let existing = cart.find(function(item) {
            return item.medicineName === name;
        });

        if (existing) {
            existing.quantity = existing.quantity + 1;
        } else {
            cart.push({
                medicineName: name,
                quantity: 1,
                unitPrice: Number(price)
            });
        }

        renderCart();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function changeQty(index, value) {
        let qty = Number(value);

        if (qty < 1 || isNaN(qty)) {
            qty = 1;
        }

        cart[index].quantity = qty;
        renderCart();
    }

    function renderCart() {
        const body = document.getElementById("cartBody");

        if (cart.length === 0) {
            body.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        No items added.
                    </td>
                </tr>
            `;

            updateTotals();
            return;
        }

        body.innerHTML = "";

        cart.forEach(function(item, index) {
            let rowTotal = Number(item.quantity) * Number(item.unitPrice);

            body.innerHTML += `
                <tr>
                    <td>${item.medicineName}</td>

                    <td>
                        <input type="number"
                               value="${item.quantity}"
                               min="1"
                               class="form-control form-control-sm"
                               onchange="changeQty(${index}, this.value)">
                    </td>

                    <td>₹${Number(item.unitPrice).toFixed(2)}</td>

                    <td>₹${rowTotal.toFixed(2)}</td>

                    <td>
                        <button type="button"
                                class="btn btn-danger btn-sm"
                                onclick="removeItem(${index})">
                            X
                        </button>
                    </td>
                </tr>
            `;
        });

        updateTotals();
    }

    function updateTotals() {
        let subtotal = 0;

        cart.forEach(function(item) {
            subtotal = subtotal + (Number(item.quantity) * Number(item.unitPrice));
        });

        let gst = subtotal * 0.12;

        let discount = Number(document.getElementById("discount").value || 0);

        if (isNaN(discount) || discount < 0) {
            discount = 0;
        }

        let grandTotal = subtotal + gst - discount;

        if (grandTotal < 0) {
            grandTotal = 0;
        }

        document.getElementById("subtotal").innerText = subtotal.toFixed(2);
        document.getElementById("gst").innerText = gst.toFixed(2);
        document.getElementById("discountShow").innerText = discount.toFixed(2);
        document.getElementById("grandTotal").innerText = grandTotal.toFixed(2);
    }

    document.getElementById("discount").addEventListener("input", updateTotals);

    function showSuccessPopup() {
        const oldPopup = document.getElementById("successPopup");

        if (oldPopup) {
            oldPopup.remove();
        }

        const popup = document.createElement("div");
        popup.id = "successPopup";
        popup.className = "success-popup";
        popup.innerText = "Bill generated successfully";

        document.body.appendChild(popup);

        setTimeout(function() {
            popup.remove();
        }, 2500);
    }

    function generateBill() {
        if (!cart || cart.length === 0) {
            alert("Please add medicines to cart");
            return;
        }

        let cleanItems = [];

        for (let i = 0; i < cart.length; i++) {
            let item = cart[i];

            let medicineName = String(item.medicineName || "").trim();
            let quantity = Number(item.quantity);
            let unitPrice = Number(item.unitPrice);

            if (medicineName === "") {
                alert("Invalid medicine name in cart");
                return;
            }

            if (isNaN(quantity) || quantity <= 0) {
                alert("Invalid quantity for " + medicineName);
                return;
            }

            if (isNaN(unitPrice) || unitPrice <= 0) {
                alert("Invalid price for " + medicineName);
                return;
            }

            cleanItems.push({
                medicineName: medicineName,
                quantity: quantity,
                unitPrice: unitPrice
            });
        }

        let discount = Number(document.getElementById("discount").value || 0);

        if (isNaN(discount) || discount < 0) {
            discount = 0;
        }

        const request = {
            customerName: document.getElementById("customerName").value.trim() || "Walk-in Customer",
            paymentMode: document.getElementById("paymentMode").value,
            discount: discount,
            items: cleanItems
        };

        fetch("/billing/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json, text/plain, */*"
            },
            body: JSON.stringify(request)
        })
        .then(function(response) {
            return response.text().then(function(text) {
                return {
                    ok: response.ok,
                    status: response.status,
                    text: text
                };
            });
        })
        .then(function(resultData) {
            if (!resultData.ok) {
                throw new Error(resultData.text || "Server error while generating bill");
            }

            let bill = null;

            try {
                bill = JSON.parse(resultData.text);
            } catch (e) {
                bill = null;
            }

            const result = document.getElementById("billResult");
            result.classList.remove("d-none");

            let subtotal = Number(document.getElementById("subtotal").innerText || 0);
            let gst = Number(document.getElementById("gst").innerText || 0);
            let total = Number(document.getElementById("grandTotal").innerText || 0);

            let billId = bill && bill.id ? bill.id : "Generated";
            let customerName = bill && bill.customerName ? bill.customerName : request.customerName;
            let paymentMode = bill && bill.paymentMode ? bill.paymentMode : request.paymentMode;
            let gstAmount = bill && bill.gstAmount != null ? Number(bill.gstAmount) : gst;
            let discountAmount = bill && bill.discount != null ? Number(bill.discount) : discount;
            let totalAmount = bill && bill.totalAmount != null ? Number(bill.totalAmount) : total;

            result.innerHTML = `
                <div class="print-bill">
                    <h5>Bill Generated Successfully</h5>
                    <hr>
                    <p><b>Bill ID:</b> ${billId}</p>
                    <p><b>Customer:</b> ${customerName}</p>
                    <p><b>Payment:</b> ${paymentMode}</p>
                    <p><b>Subtotal:</b> ₹${subtotal.toFixed(2)}</p>
                    <p><b>GST:</b> ₹${gstAmount.toFixed(2)}</p>
                    <p><b>Discount:</b> ₹${discountAmount.toFixed(2)}</p>
                    <h4><b>Total Payable:</b> ₹${totalAmount.toFixed(2)}</h4>
                </div>
            `;

            showSuccessPopup();

            cart = [];
            renderCart();

            document.getElementById("customerName").value = "";
            document.getElementById("discount").value = 0;
            updateTotals();
        })
        .catch(function(error) {
            console.error(error);
            alert("Error generating bill: " + error.message);
        });
    }

    document.getElementById("search").addEventListener("input", function () {
        let value = this.value.toLowerCase();

        document.querySelectorAll(".medicine-wrapper").forEach(function(wrapper) {
            let text = wrapper.innerText.toLowerCase();

            if (text.includes(value)) {
                wrapper.style.display = "block";
            } else {
                wrapper.style.display = "none";
            }
        });
    });
</script>

</body>
</html>
