<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PIMS Billing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef3f9;
            font-family: Arial, sans-serif;
        }

        .topbar{
            background:#1e293b;
            color:white;
            padding:15px 25px;
        }

        .medicine-card{
            border:none;
            border-radius:15px;
            transition:0.3s;
            cursor:pointer;
        }

        .medicine-card:hover{
            transform:scale(1.03);
        }

        .medicine-card img{
            height:90px;
            object-fit:contain;
        }

        .cart-box{
            background:white;
            border-radius:15px;
            padding:20px;
            position:sticky;
            top:20px;
        }

        .search-box{
            border-radius:12px;
            height:50px;
        }

        .bill-btn{
            height:50px;
            font-size:18px;
            border-radius:12px;
        }

        .total-box{
            background:#0f172a;
            color:white;
            border-radius:12px;
            padding:15px;
        }

        .qty-btn{
            width:30px;
            height:30px;
            border:none;
            border-radius:50%;
            background:#2563eb;
            color:white;
        }

    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<div class="topbar d-flex justify-content-between align-items-center">

    <h3>💊 PIMS Billing System</h3>

    <div>
        <a href="/dashboard" class="btn btn-light">Dashboard</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

</div>

<div class="container-fluid mt-4">

    <div class="row">

        <!-- LEFT SIDE -->
        <div class="col-md-8">

            <!-- SEARCH -->
            <div class="card shadow-sm p-3 mb-4 border-0">

                <input type="text"
       id="searchBox"
       class="form-control form-control-lg search-box"
       placeholder="🔍 Scan barcode or search medicine"
       autofocus>

            </div>

            <!-- MEDICINE GRID -->
            <div class="row" id="medicineContainer">

                <div class="col-md-3 mb-4"
                     th:each="m : ${medicines}">

                    <div class="card medicine-card shadow-sm p-3 text-center">

                       <img th:src="${m.imageUrl}">

                        <h6 class="mt-3"
                            th:text="${m.name}">
                        </h6>

                        <p class="text-muted"
                           th:text="${m.category}">
                        </p>

                        <button class="btn btn-primary w-100"
                                th:attr="onclick=|addToCart('${m.name}', '${m.barcode}', 100)|">

                            Add to Cart

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE CART -->
        <div class="col-md-4">

            <div class="cart-box shadow">

                <h4>🛒 Cart</h4>

                <hr>

                <!-- CUSTOMER -->
                <input type="text"
                       class="form-control mb-3"
                       placeholder="Customer Name">

                <!-- CART TABLE -->
                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Medicine</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                    </thead>

                    <tbody id="cartBody">

                    </tbody>

                </table>

                <!-- TOTAL -->
                <div class="total-box mb-3">

                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <span>₹<span id="subtotal">0</span></span>
                    </div>

                    <div class="d-flex justify-content-between">
                        <span>GST (12%)</span>
                        <span>₹<span id="gst">0</span></span>
                    </div>

                    <hr style="background:white">

                    <div class="d-flex justify-content-between">
                        <strong>Grand Total</strong>
                        <strong>₹<span id="grandTotal">0</span></strong>
                    </div>

                </div>

                <!-- PAYMENT -->
                <form action="/billing/save" method="post">

                    <select name="paymentMode"
                            class="form-control mb-3">

                        <option>Cash</option>
                        <option>Card</option>
                        <option>UPI</option>

                    </select>

                    <div class="d-grid gap-2">

    <button class="btn btn-success bill-btn">

        Generate Invoice

    </button>

    <a href="/billing/generate-pdf"
       class="btn btn-danger">

        Download PDF Bill

    </a>

</div>

                        

                    

                </form>

            </div>

        </div>

    </div>

</div>

<script>

    let total = 0;

    // SEARCH FILTER
    document.getElementById("searchBox")
        .addEventListener("keyup", function() {

        let value = this.value.toLowerCase();

        let cards = document.querySelectorAll(".medicine-card");

        cards.forEach(card => {

            let text = card.innerText.toLowerCase();

            card.parentElement.style.display =
                text.includes(value) ? "block" : "none";
        });

    });

    // ADD TO CART
    function addToCart(name, barcode, price) {

        let gst = price * 0.12;

        let finalPrice = price + gst;

        total += finalPrice;

        let row = `
            <tr>

                <td>

    ${name}

    <br>

    <small class="text-muted">
        ${barcode}
    </small>

</td>

                <td>
                    <button class="qty-btn">-</button>
                    1
                    <button class="qty-btn">+</button>
                </td>

                <td>₹${finalPrice.toFixed(2)}</td>

            </tr>
        `;

        document.getElementById("cartBody")
            .innerHTML += row;

        updateTotals();
    }

    // UPDATE TOTALS
    function updateTotals() {

        let subtotal = total / 1.12;

        let gst = total - subtotal;

        document.getElementById("subtotal")
            .innerText = subtotal.toFixed(2);

        document.getElementById("gst")
            .innerText = gst.toFixed(2);

        document.getElementById("grandTotal")
            .innerText = total.toFixed(2);
    }
    // BARCODE ENTER DETECTION

document.getElementById("searchBox")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        alert(
            "Barcode Scanned: "
            + this.value
        );

        this.value = "";
    }
});

</script>


</body>
</html>
