<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }

        .stock-card {
            border: none;
            border-radius: 20px;
        }

        .expired {
            background-color: #ffe1e1 !important;
        }

        .warning {
            background-color: #fff0cc !important;
        }

        .safe {
            background-color: #e2ffe2 !important;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>📦 Stock Management</h2>
            <p class="text-muted">Add stock batches and track expiry status</p>
        </div>

        <a href="/dashboard" class="btn btn-dark">Dashboard</a>
    </div>

    <div th:if="${success != null}" class="alert alert-success">
        Stock added successfully.
    </div>

    <div th:if="${error != null}" class="alert alert-danger">
        Could not add stock. Please select medicine and try again.
    </div>

    <!-- ADD STOCK -->
    <div class="card stock-card shadow p-4 mb-5">

        <h4 class="mb-4">➕ Add Stock</h4>

        <form action="/stock/save" method="post">

            <div class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Medicine</label>

                    <select name="medicineId" class="form-control" required>
                        <option value="">Select Medicine</option>

                        <option th:each="m : ${medicines}"
                                th:value="${m.id}"
                                th:text="${m.name}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Quantity</label>

                    <input type="number"
                           name="quantity"
                           class="form-control"
                           min="1"
                           required>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Reorder Level</label>

                    <input type="number"
                           name="reorderLevel"
                           class="form-control"
                           min="0"
                           required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Expiry Date</label>

                    <input type="date"
                           name="expiryDate"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-success w-100">
                        Add Stock
                    </button>
                </div>

            </div>

        </form>

    </div>

    <!-- STOCK TABLE -->
    <div class="card stock-card shadow p-4">

        <h4 class="mb-4">📋 Stock List</h4>

        <table class="table table-bordered align-middle">

            <thead class="table-dark">
            <tr>
                <th>Medicine</th>
                <th>Qty</th>
                <th>Reorder Level</th>
                <th>Expiry</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(stockList)}">
                <td colspan="5" class="text-center text-muted">
                    No stock added yet.
                </td>
            </tr>

            <tr th:each="s : ${stockList}"
                th:class="${s.expiryDate.isBefore(T(java.time.LocalDate).now())} ? 'expired' :
                          (!s.expiryDate.isBefore(T(java.time.LocalDate).now()) &&
                          s.expiryDate.isBefore(T(java.time.LocalDate).now().plusDays(30))) ? 'warning' : 'safe'">

                <td th:text="${s.medicine != null ? s.medicine.name : 'No Medicine'}"></td>

                <td th:text="${s.quantity}"></td>

                <td th:text="${s.reorderLevel}"></td>

                <td th:text="${s.expiryDate}"></td>

                <td>
                    <span th:if="${s.expiryDate.isBefore(T(java.time.LocalDate).now())}"
                          class="badge bg-danger">
                        Expired
                    </span>

                    <span th:if="${!s.expiryDate.isBefore(T(java.time.LocalDate).now()) &&
                                  s.expiryDate.isBefore(T(java.time.LocalDate).now().plusDays(30))}"
                          class="badge bg-warning text-dark">
                        Expiring Soon
                    </span>

                    <span th:if="${s.expiryDate.isAfter(T(java.time.LocalDate).now().plusDays(30)) ||
                                  s.expiryDate.isEqual(T(java.time.LocalDate).now().plusDays(30))}"
                          class="badge bg-success">
                        Safe
                    </span>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
