<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Factory Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }

        .factory-card {
            border: none;
            border-radius: 20px;
        }

        .badge {
            font-size: 13px;
            padding: 8px 12px;
        }
    </style>
</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>🏭 Factory Supplier Portal</h2>
            <p class="text-muted">View, accept, reject and dispatch pharmacy orders</p>
        </div>

        <a href="/logout" class="btn btn-danger">Logout</a>

    </div>

    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card factory-card shadow p-4 bg-primary text-white">
                <h5>Total Orders</h5>
                <h2 th:text="${#lists.size(orders)}"></h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card factory-card shadow p-4 bg-warning text-dark">
                <h5>Pending Orders</h5>
                <h2 th:text="${#lists.size(orders.?[status == 'Pending'])}"></h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card factory-card shadow p-4 bg-success text-white">
                <h5>Dispatched Orders</h5>
                <h2 th:text="${#lists.size(orders.?[status == 'Dispatched'])}"></h2>
            </div>
        </div>

    </div>

    <div class="card shadow border-0 p-4">

        <h4 class="mb-4">📦 Orders From Pharmacist</h4>

        <table class="table table-hover align-middle">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Supplier</th>
                <th>Medicine</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Status</th>
                <th>Remark</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="o : ${orders}">

                <td th:text="${o.id}"></td>

                <td th:text="${o.supplier != null ? o.supplier.name : 'No Supplier'}"></td>

                <td th:text="${o.medicineName}"></td>

                <td th:text="${o.quantity}"></td>

                <td>
                    ₹<span th:text="${o.totalAmount}"></span>
                </td>

                <td>
                    <span th:if="${o.status == 'Pending'}"
                          class="badge bg-warning text-dark">Pending</span>

                    <span th:if="${o.status == 'Accepted'}"
                          class="badge bg-primary">Accepted</span>

                    <span th:if="${o.status == 'Rejected'}"
                          class="badge bg-danger">Rejected</span>

                    <span th:if="${o.status == 'Dispatched'}"
                          class="badge bg-info text-dark">Dispatched</span>

                    <span th:if="${o.status == 'Received'}"
                          class="badge bg-success">Received</span>
                </td>

                <td th:text="${o.factoryRemark != null ? o.factoryRemark : '-'}"></td>

                <td>

                    <!-- ACCEPT -->
                    <form th:if="${o.status == 'Pending'}"
                          th:action="@{'/factory/orders/' + ${o.id} + '/accept'}"
                          method="post"
                          class="d-inline">

                        <button class="btn btn-primary btn-sm">
                            Accept
                        </button>
                    </form>

                    <!-- REJECT -->
                    <form th:if="${o.status == 'Pending'}"
                          th:action="@{'/factory/orders/' + ${o.id} + '/reject'}"
                          method="post"
                          class="d-inline">

                        <input type="hidden"
                               name="remark"
                               value="Rejected due to unavailable stock">

                        <button class="btn btn-danger btn-sm">
                            Reject
                        </button>
                    </form>

                    <!-- DISPATCH -->
                    <form th:if="${o.status == 'Accepted'}"
                          th:action="@{'/factory/orders/' + ${o.id} + '/dispatch'}"
                          method="post"
                          class="d-inline">

                        <button class="btn btn-success btn-sm">
                            Dispatch
                        </button>
                    </form>

                    <span th:if="${o.status == 'Rejected' || o.status == 'Dispatched' || o.status == 'Received'}"
                          class="text-muted">
                        Completed
                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
