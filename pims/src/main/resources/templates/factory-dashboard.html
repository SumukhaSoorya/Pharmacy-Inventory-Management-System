<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Factory Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
        }

        .factory-card{
            border:none;
            border-radius:20px;
            transition:0.3s;
        }

        .factory-card:hover{
            transform:translateY(-5px);
        }

    </style>

</head>

<body>

<div class="container-fluid p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>

                🏭 Factory Supplier Portal

            </h2>

            <p class="text-muted">

                Manage pharmacy orders and dispatch

            </p>

        </div>

        <a href="/logout"
           class="btn btn-danger">

            Logout

        </a>

    </div>

    <!-- KPI -->
    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card factory-card shadow p-4 bg-primary text-white">

                <h5>Total Orders</h5>

                <h2 th:text="${#lists.size(orders)}"></h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card factory-card shadow p-4 bg-success text-white">

                <h5>Dispatched</h5>

                <h2>12</h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card factory-card shadow p-4 bg-warning text-dark">

                <h5>Pending</h5>

                <h2>5</h2>

            </div>

        </div>

    </div>

    <!-- PURCHASE ORDERS -->
    <div class="card shadow border-0 p-4">

        <h4 class="mb-4">

            📦 Pharmacy Purchase Orders

        </h4>

        <table class="table table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Medicine</th>

                <th>Quantity</th>

                <th>Total</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="o : ${orders}">

                <td th:text="${o.id}"></td>

                <td th:text="${o.medicineName}"></td>

                <td th:text="${o.quantity}"></td>

                <td th:text="${o.totalAmount}"></td>

                <td>

                    <span class="badge bg-warning"
                          th:text="${o.status}">
                    </span>

                </td>

                <td>

                    <button class="btn btn-success btn-sm">

                        Mark Dispatched

                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
