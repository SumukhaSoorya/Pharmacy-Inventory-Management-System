<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Sales Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#eef2f7;
        }

        .report-card{
            border:none;
            border-radius:20px;
            color:white;
            padding:25px;
        }

        .sales{
            background:linear-gradient(135deg,#2563eb,#1d4ed8);
        }

        .gst{
            background:linear-gradient(135deg,#16a34a,#15803d);
        }

        .bills{
            background:linear-gradient(135deg,#dc2626,#b91c1c);
        }

    </style>

</head>

<body>

<div class="container-fluid p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>📊 Sales Analytics</h2>

            <p class="text-muted">

                Pharmacy business insights

            </p>

        </div>

        <a href="/dashboard"
           class="btn btn-dark">

            Dashboard

        </a>

    </div>

    <!-- CARDS -->
    <div class="row">

        <!-- SALES -->
        <div class="col-md-4">

            <div class="report-card sales shadow">

                <h5>Total Sales</h5>

                <h2>

                    ₹<span th:text="${sales}"></span>

                </h2>

            </div>

        </div>

        <!-- GST -->
        <div class="col-md-4">

            <div class="report-card gst shadow">

                <h5>Total GST</h5>

                <h2>

                    ₹<span th:text="${gst}"></span>

                </h2>

            </div>

        </div>

        <!-- BILLS -->
        <div class="col-md-4">

            <div class="report-card bills shadow">

                <h5>Total Bills</h5>

                <h2>

                    <span th:text="${bills}"></span>

                </h2>

            </div>

        </div>

    </div>

    <!-- CHART -->
    <div class="card shadow border-0 mt-5 p-4">

        <h4>

            📈 Monthly Sales Trend

        </h4>

        <canvas id="salesChart"></canvas>

    </div>

    <!-- PAYMENT ANALYTICS -->
    <div class="card shadow border-0 mt-4 p-4">

        <h4>

            💳 Payment Analytics

        </h4>

        <canvas id="paymentChart"></canvas>

    </div>

</div>

<script>

    // SALES CHART
    new Chart(document.getElementById("salesChart"), {

        type:'line',

        data:{

            labels:[
                'Jan',
                'Feb',
                'Mar',
                'Apr',
                'May',
                'Jun'
            ],

            datasets:[{

                label:'Sales',

                data:[
                    12000,
                    19000,
                    15000,
                    25000,
                    22000,
                    30000
                ],

                borderWidth:3

            }]
        }
    });

    // PAYMENT CHART
    new Chart(document.getElementById("paymentChart"), {

        type:'doughnut',

        data:{

            labels:[
                'Cash',
                'Card',
                'UPI'
            ],

            datasets:[{

                data:[
                    45,
                    25,
                    30
                ]

            }]
        }
    });

</script>

</body>
</html>
