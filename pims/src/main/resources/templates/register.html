<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('https://images.unsplash.com/photo-1580281657527-47e3f8a2c1c5') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            color: white;
            width: 350px;
        }
    </style>
</head>

<body>

<div class="card text-center">
    <h3>Create Account</h3>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <input type="text" th:field="*{username}" class="form-control mb-2" placeholder="Username" required>
        <input type="password" th:field="*{password}" class="form-control mb-2" placeholder="Password" required>

        <!-- ROLE SELECT -->
        <select th:field="*{role}" class="form-control mb-3">
            <option value="ROLE_ADMIN">Shopkeeper</option>
            <option value="ROLE_FACTORY">Factory</option>
        </select>

        <button class="btn btn-success w-100">Register</button>
    </form>

    <p class="mt-3">
        Already have account? <a href="/login" class="text-info">Login</a>
    </p>
</div>

</body>
</html>
