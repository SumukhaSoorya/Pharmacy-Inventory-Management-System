<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Suppliers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
        }

        .supplier-card{
            border:none;
            border-radius:20px;
            transition:0.3s;
        }

        .supplier-card:hover{
            transform:translateY(-5px);
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>🏭 Supplier Management</h2>

        <a href="/dashboard"
           class="btn btn-dark">

            Dashboard

        </a>

    </div>

    <!-- ADD FORM -->
    <div class="card shadow p-4 mb-5 border-0">

        <h4 class="mb-4">

            ➕ Add Supplier

        </h4>

        <form th:action="@{/suppliers/save}"
              method="post"
              th:object="${supplier}">

            <div class="row">

                <div class="col-md-4">

                    <input th:field="*{name}"
                           class="form-control"
                           placeholder="Supplier Name">

                </div>

                <div class="col-md-4">

                    <input th:field="*{contact}"
                           class="form-control"
                           placeholder="Contact Number">

                </div>

                <div class="col-md-4">

                    <input th:field="*{email}"
                           class="form-control"
                           placeholder="Email">

                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-6">

                    <input th:field="*{address}"
                           class="form-control"
                           placeholder="Address">

                </div>

                <div class="col-md-4">

                    <input th:field="*{drugLicenseNo}"
                           class="form-control"
                           placeholder="Drug License">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-success w-100">

                        Save

                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- SUPPLIER CARDS -->
    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="s : ${suppliers}">

            <div class="card supplier-card shadow p-4">

                <h4 th:text="${s.name}"></h4>

                <p>

                    📞
                    <span th:text="${s.contact}"></span>

                </p>

                <p>

                    ✉
                    <span th:text="${s.email}"></span>

                </p>

                <p>

                    🏢
                    <span th:text="${s.address}"></span>

                </p>

                <span class="badge bg-primary">

                    License:
                    <span th:text="${s.drugLicenseNo}"></span>

                </span>

            </div>

        </div>

    </div>

</div>

</body>
</html>
